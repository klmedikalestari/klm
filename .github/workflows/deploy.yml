name: Deploy Website to cPanel

on:
  push:
    branches:
      - main # Akan berjalan otomatis setiap ada push ke branch main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v3
    
    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftps
        port: 21
        # Exclude file/folder yang tidak perlu diupload ke server cPanel
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/*.zip
          **/*.bak
          import-tools/**
          test-extract/**
          raw_html.txt
          produk.xlsx

    - name: 🔄 Purge OPcache & LiteSpeed Cache (Post-Deploy)
      run: |
        sleep 2
        curl -s -k "https://kinglabmedikalestari.com/author/admin/?purge_klm_cache=1" || true
        curl -s -k "https://kinglabmedikalestari.com/random-cache-purge-trigger/?purge_klm_cache=1" || true
        echo "Restart LSPHP" > restart.txt
        curl -v -k --ftp-ssl --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" -T restart.txt "ftp://${{ secrets.FTP_SERVER }}/.lsphp_restart.txt" || true
        curl -v -k --ftp-ssl --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" -T restart.txt "ftp://${{ secrets.FTP_SERVER }}/../.lsphp_restart.txt" || true
        curl -v -k --ftp-ssl --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" -T restart.txt "ftp://${{ secrets.FTP_SERVER }}/../../.lsphp_restart.txt" || true
        curl -v -k --ftp-ssl --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" -T restart.txt "ftp://${{ secrets.FTP_SERVER }}/../../../.lsphp_restart.txt" || true
        curl -v -k --ftp-ssl --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" -T restart.txt "ftp://${{ secrets.FTP_SERVER }}/../../../../.lsphp_restart.txt" || true

    - name: 🚀 Warmup Cache
      run: |
        sleep 2
        curl -s -k "https://kinglabmedikalestari.com/?warmup=$(date +%s)" > /dev/null || true


