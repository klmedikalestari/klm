name: Deploy Website to cPanel

on:
  push:
    branches:
      - main # Akan berjalan otomatis setiap ada push ke branch main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftps
        port: 21
        # Exclude file/folder yang tidak perlu diupload ke server cPanel
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/*.zip
          **/*.bak
          import-tools/**
          test-extract/**
          raw_html.txt
          produk.xlsx

    - name: 📤 Force upload functions.php and templates via FTPS
      run: |
        echo "=== 1. Test marker upload paths ===" > ftp_report.txt
        echo "KINGLAB_MARKER_TEST_$(date +%s)" > marker.txt

        for p in \
          "" \
          "public_html/" \
          "public_html/wp-content/themes/KINGLAB/" \
          "wp-content/themes/KINGLAB/" \
          "../public_html/" \
          "../public_html/wp-content/themes/KINGLAB/" \
          "../../public_html/" \
          "../../public_html/wp-content/themes/KINGLAB/"
        do
          echo "--- Testing ${p} ---" >> ftp_report.txt
          curl -s -k --ftp-ssl --ftp-create-dirs --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" -T marker.txt "ftp://${{ secrets.FTP_SERVER }}/${p}marker.txt" >> ftp_report.txt 2>&1 || true
          curl -s -k --ftp-ssl --ftp-create-dirs --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" -T functions.php "ftp://${{ secrets.FTP_SERVER }}/${p}functions.php" || true
          curl -s -k --ftp-ssl --ftp-create-dirs --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" -T taxonomy-product_brand-biobase.php "ftp://${{ secrets.FTP_SERVER }}/${p}taxonomy-product_brand-biobase.php" || true
        done

        echo "=== 2. HTTP checks for marker ===" >> ftp_report.txt
        echo "Root marker HTTP:" >> ftp_report.txt
        curl -s -k "https://kinglabmedikalestari.com/marker.txt" >> ftp_report.txt || true
        echo "" >> ftp_report.txt
        echo "Theme marker HTTP:" >> ftp_report.txt
        curl -s -k "https://kinglabmedikalestari.com/wp-content/themes/KINGLAB/marker.txt" >> ftp_report.txt || true
        echo "" >> ftp_report.txt

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git checkout -B debug-ftp
        git add -f ftp_report.txt
        git commit -m "debug: ftp path discovery report" || true
        git push -f origin debug-ftp || true
        git checkout main

    - name: 🔄 Trigger OPcache & Cache Reset via biobase
      run: |
        sleep 2
        curl -v -k "https://kinglabmedikalestari.com/product_brand/biobase/?opcache_diag=1" || true

    - name: 🚀 Warmup Cache
      run: |
        sleep 2
        curl -s -k "https://kinglabmedikalestari.com/?warmup=$(date +%s)" > /dev/null || true


