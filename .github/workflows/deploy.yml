name: Deploy Website to cPanel

on:
  push:
    branches:
      - main # Akan berjalan otomatis setiap ada push ke branch main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftps
        port: 21
        # Exclude file/folder yang tidak perlu diupload ke server cPanel
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/*.zip
          **/*.bak
          import-tools/**
          test-extract/**
          raw_html.txt
          produk.xlsx

    - name: 📤 Force upload functions.php and templates via FTPS
      run: |
        curl -v -k --ftp-ssl --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" -T functions.php "ftp://${{ secrets.FTP_SERVER }}/functions.php"
        curl -v -k --ftp-ssl --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" -T import-cdr-products.php "ftp://${{ secrets.FTP_SERVER }}/import-cdr-products.php"
        curl -v -k --ftp-ssl --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" -T import-chm-products.php "ftp://${{ secrets.FTP_SERVER }}/import-chm-products.php"
        curl -v -k --ftp-ssl --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" -T taxonomy-product_brand-biobase.php "ftp://${{ secrets.FTP_SERVER }}/taxonomy-product_brand-biobase.php"

    - name: 🔄 Trigger OPcache & Cache Reset via biobase, chm, and cdr
      run: |
        sleep 2
        curl -v -k "https://kinglabmedikalestari.com/?force_cdr_import=1&reset_cache=1" || true
        curl -v -k "https://kinglabmedikalestari.com/?run_chm_import=1&reset_cache=1" || true
        curl -v -k "https://kinglabmedikalestari.com/product_brand/biobase/?opcache_diag=1" || true

    - name: 🚀 Warmup Cache
      run: |
        sleep 2
        curl -s -k "https://kinglabmedikalestari.com/?warmup=$(date +%s)" > /dev/null || true


