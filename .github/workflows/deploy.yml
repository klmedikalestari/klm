name: Deploy Website to cPanel

on:
  push:
    branches:
      - main # Akan berjalan otomatis setiap ada push ke branch main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftps
        port: 21
        # Exclude file/folder yang tidak perlu diupload ke server cPanel
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/*.zip
          **/*.bak
          import-tools/**
          test-extract/**
          raw_html.txt
          produk.xlsx

    - name: 🔍 Diagnose FTP target
      run: |
        H="${{ secrets.FTP_SERVER }}"
        A="${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}"
        {
          echo "=== FTP host IP ==="; getent hosts "$H" | awk '{print $1}'
          echo "=== Site IP ==="; getent hosts kinglabmedikalestari.com | awk '{print $1}'
          echo "=== PWD ==="; curl -sv -k --ftp-ssl --user "$A" "ftp://$H/" -Q "PWD" -o /dev/null 2>&1 | grep -E "^< 257" || true
          echo "=== LIST / ==="; curl -s -k --ftp-ssl --user "$A" "ftp://$H/" || true
          echo "=== LIST ../ ==="; curl -s -k --ftp-ssl --user "$A" "ftp://$H/../" || true
          echo "=== LIST ../../ ==="; curl -s -k --ftp-ssl --user "$A" "ftp://$H/../../" || true
          echo "=== LIST /public_html/wp-content/themes/ ==="; curl -s -k --ftp-ssl --user "$A" "ftp://$H/public_html/wp-content/themes/" || true
          echo "=== LIST ../public_html/wp-content/themes/ ==="; curl -s -k --ftp-ssl --user "$A" "ftp://$H/../public_html/wp-content/themes/" || true
          echo "=== LIST ../../public_html/wp-content/themes/ ==="; curl -s -k --ftp-ssl --user "$A" "ftp://$H/../../public_html/wp-content/themes/" || true
          echo "=== LIST assets/js ==="; curl -s -k --ftp-ssl --user "$A" "ftp://$H/assets/js/" || true
        } > ftp_diag.txt 2>&1
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git checkout -B debug-ftp
        git add -f ftp_diag.txt
        git commit -m "debug: ftp diag" || true
        git push -f origin debug-ftp || true
        git checkout main

    - name: 📤 Force upload functions.php and templates via FTPS
      run: |
        curl -v -k --ftp-ssl --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" -T functions.php "ftp://${{ secrets.FTP_SERVER }}/functions.php"
        curl -v -k --ftp-ssl --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" -T import-cdr-products.php "ftp://${{ secrets.FTP_SERVER }}/import-cdr-products.php"
        curl -v -k --ftp-ssl --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" -T import-chm-products.php "ftp://${{ secrets.FTP_SERVER }}/import-chm-products.php"
        curl -v -k --ftp-ssl --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" -T taxonomy-product_brand-biobase.php "ftp://${{ secrets.FTP_SERVER }}/taxonomy-product_brand-biobase.php"

    - name: 🔄 Trigger OPcache & Cache Reset via biobase, chm, and cdr
      run: |
        sleep 2
        curl -v -k "https://kinglabmedikalestari.com/?force_cdr_import=1&reset_cache=1" || true
        curl -v -k "https://kinglabmedikalestari.com/?run_chm_import=1&reset_cache=1" || true
        curl -v -k "https://kinglabmedikalestari.com/product_brand/biobase/?opcache_diag=1" || true

    - name: 🚀 Warmup Cache
      run: |
        sleep 2
        curl -s -k "https://kinglabmedikalestari.com/?warmup=$(date +%s)" > /dev/null || true


