<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Plasticware: Test tube rack circular/tiered with colored test tubes -->
  <rect width="120" height="120" rx="16" fill="#f8fafc"/>
  <!-- Circular Base -->
  <ellipse cx="60" cy="94" rx="42" ry="12" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
  <ellipse cx="60" cy="88" rx="40" ry="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Central Spindle -->
  <rect x="58" y="24" width="4" height="65" fill="#cbd5e1" rx="2"/>
  <!-- Tubes standing -->
  <!-- Yellow Tube Left -->
  <rect x="36" y="44" width="9" height="42" rx="4.5" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
  <line x1="36" y1="52" x2="45" y2="52" stroke="#ca8a04" stroke-width="1"/>
  <!-- Red Tube Center -->
  <rect x="55.5" y="28" width="9" height="58" rx="4.5" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="57" y="46" width="6" height="38" rx="3" fill="#ef4444" opacity="0.8"/>
  <line x1="55.5" y1="42" x2="64.5" y2="42" stroke="#dc2626" stroke-width="1"/>
  <!-- Green Tube Right -->
  <rect x="75" y="46" width="9" height="40" rx="4.5" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="76.5" y="58" width="6" height="26" rx="3" fill="#22c55e" opacity="0.8"/>
  <line x1="75" y1="54" x2="84" y2="54" stroke="#16a34a" stroke-width="1"/>
  <!-- Rack Posts -->
  <rect x="26" y="58" width="5" height="32" rx="2.5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <rect x="47" y="54" width="5" height="36" rx="2.5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <rect x="68" y="54" width="5" height="36" rx="2.5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <rect x="89" y="58" width="5" height="32" rx="2.5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
</svg>
