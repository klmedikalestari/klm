<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Hospital & Blood Bank Centrifuge -->
  <rect width="120" height="120" rx="16" fill="#fff1f2"/>
  <!-- Heavy Duty Floor / Bench Blood Bank Unit -->
  <rect x="28" y="32" width="64" height="60" rx="10" fill="#ffffff" stroke="#e11d48" stroke-width="3"/>
  <!-- Front Screen / Touch Display -->
  <rect x="36" y="40" width="48" height="20" rx="4" fill="#881337"/>
  <!-- Blood Bag Symbol & Red Cross on Screen -->
  <rect x="57" y="45" width="6" height="10" rx="1" fill="#fda4af"/>
  <rect x="55" y="47" width="10" height="6" rx="1" fill="#fda4af"/>
  <text x="75" y="53" font-size="6" font-weight="bold" fill="#fff" font-family="Arial">BLOOD</text>
  <text x="75" y="58" font-size="5" fill="#fda4af" font-family="Arial">BANK</text>
  <!-- Blood Drops -->
  <path d="M44 48 C44 45 46 44 46 44 C46 44 48 45 48 48 C48 49 47 50 46 50 C45 50 44 49 44 48 Z" fill="#f43f5e"/>
  <!-- Vent Grille -->
  <line x1="38" y1="68" x2="82" y2="68" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="74" x2="82" y2="74" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="80" x2="82" y2="80" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
  <!-- Casters -->
  <circle cx="38" cy="95" r="3.5" fill="#475569"/>
  <circle cx="82" cy="95" r="3.5" fill="#475569"/>
</svg>
