<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Refrigerated Centrifuge Icon -->
  <rect width="120" height="120" rx="16" fill="#f0f9ff"/>
  <!-- Floor Unit Body -->
  <rect x="30" y="26" width="60" height="68" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="3"/>
  <rect x="30" y="26" width="60" height="18" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <!-- Digital Display Panel -->
  <rect x="42" y="52" width="36" height="14" rx="3" fill="#07236d"/>
  <text x="60" y="62" font-size="7" font-weight="bold" fill="#38bdf8" text-anchor="middle" font-family="monospace">-20°C</text>
  <!-- Cooling Vents -->
  <line x1="42" y1="74" x2="78" y2="74" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="80" x2="78" y2="80" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
  <!-- Snowflake Motif -->
  <circle cx="60" cy="35" r="4" fill="#0284c7"/>
  <path d="M60 27 L60 43 M52 35 L68 35 M54 29 L66 41 M54 41 L66 29" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Casters -->
  <circle cx="40" cy="98" r="4" fill="#64748b"/>
  <circle cx="80" cy="98" r="4" fill="#64748b"/>
</svg>
